<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="30%" cy="45%" r="85%">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#121214"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="26" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.2" height="1.2" fill="#000" opacity="0.10"/>
      <rect x="2" y="2" width="1.2" height="1.2" fill="#fff" opacity="0.10"/>
    </pattern>
    <clipPath id="screenClip"><rect x="60" y="94" width="340" height="472" rx="2"/></clipPath>
    <clipPath id="artClip"><rect x="60" y="94" width="340" height="340"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M0 900H1600M0 1050H1600"/>
    <path d="M150 0V1200M300 0V1200M450 0V1200M600 0V1200M750 0V1200M900 0V1200M1050 0V1200M1200 0V1200M1350 0V1200M1500 0V1200"/>
  </g>

  <!-- ===================== DEVICE ===================== -->
  <g transform="translate(70,92) scale(1.6)" filter="url(#shadow)">
    <g transform="translate(-30,-8)">
      <rect x="190" y="8" width="80" height="16" rx="8" fill="#8a8a86"/>
      <rect x="24" y="150" width="8" height="34" rx="3" fill="#c9c9c5"/>
      <rect x="24" y="200" width="8" height="34" rx="3" fill="#c9c9c5"/>
      <rect x="24" y="460" width="8" height="34" rx="3" fill="#c9c9c5"/>
      <rect x="30" y="20" width="400" height="620" rx="26" fill="#f2f2ef" stroke="#d6d6d2" stroke-width="2"/>
      <rect x="46" y="80" width="368" height="500" rx="6" fill="#e7e7e3"/>
      <text x="230" y="58" text-anchor="middle" font-size="11" letter-spacing="3" fill="#a5a5a0" font-weight="bold">M5STACK · PAPERCOLOR</text>
      <rect x="60" y="94" width="340" height="472" fill="#faf9f6"/>

      <g clip-path="url(#screenClip)">
        <!-- album art (fictitious): "Low Tide Signals", Spectra 6 palette -->
        <g clip-path="url(#artClip)">
          <rect x="60" y="94" width="340" height="340" fill="#f4f2ec"/>
          <rect x="60" y="94" width="340" height="190" fill="#1b3a6b"/>
          <circle cx="300" cy="190" r="62" fill="#f4c400"/>
          <circle cx="300" cy="190" r="34" fill="#c0392b"/>
          <path d="M60 270 Q102 240 145 270 T230 270 T315 270 T400 270 V434 H60Z" fill="#2e6f40"/>
          <path d="M60 310 Q102 280 145 310 T230 310 T315 310 T400 310 V434 H60Z" fill="#f4f2ec"/>
          <path d="M60 345 Q102 315 145 345 T230 345 T315 345 T400 345 V434 H60Z" fill="#1b3a6b"/>
          <path d="M60 380 Q102 350 145 380 T230 380 T315 380 T400 380 V434 H60Z" fill="#1a1a1a"/>
          <g fill="#f4f2ec">
            <rect x="92" y="130" width="6" height="40"/><rect x="104" y="118" width="6" height="64"/>
            <rect x="116" y="138" width="6" height="24"/><rect x="128" y="112" width="6" height="76"/>
            <rect x="140" y="126" width="6" height="48"/><rect x="152" y="140" width="6" height="20"/>
          </g>
          <text x="92" y="415" font-size="13" font-weight="bold" letter-spacing="4" fill="#f4c400">LOW TIDE SIGNALS</text>
          <rect x="60" y="94" width="340" height="340" fill="url(#dither)"/>
        </g>
        <rect x="60" y="94" width="340" height="340" fill="none" stroke="#1a1a1a" stroke-width="2"/>

        <text x="80" y="470" font-size="22" font-weight="bold" fill="#1a1a1a">Glass Harbor</text>
        <text x="80" y="500" font-size="16" fill="#1a1a1a">Northern Relay</text>
        <text x="80" y="524" font-size="13" fill="#1a1a1a">Low Tide Signals</text>
        <text x="80" y="552" font-size="16" font-weight="bold" fill="#1a1a1a">TIDAL 384kHz/32bit · 24576 kbps</text>
      </g>
      <rect x="60" y="94" width="340" height="472" rx="2" fill="none" stroke="#c4c4c0" stroke-width="1"/>
    </g>
  </g>


  <!-- ===================== COPY ===================== -->
  <g transform="translate(830,0)">
    <text x="0" y="168" font-size="20" font-weight="bold" letter-spacing="5" fill="#f4c400">M5STACK-LAB · OPEN SOURCE</text>
    <text x="-6" y="318" font-size="168" font-weight="bold" fill="#f6f5f1" letter-spacing="-4">Liner</text>
    <!-- spectra 6 swatch bar -->
    <g transform="translate(0,350)">
      <rect width="96" height="10" fill="#1a1a1a" stroke="#3a3a3e"/>
      <rect x="96" width="96" height="10" fill="#f6f5f1"/>
      <rect x="192" width="96" height="10" fill="#f4c400"/>
      <rect x="288" width="96" height="10" fill="#c0392b"/>
      <rect x="384" width="96" height="10" fill="#1b3a6b"/>
      <rect x="480" width="96" height="10" fill="#2e6f40"/>
    </g>
    <text x="0" y="420" font-size="34" fill="#e9e8e3">Now-playing liner notes for</text>
    <text x="0" y="462" font-size="34" fill="#e9e8e3">your Volumio streamer, on</text>
    <text x="0" y="504" font-size="34" fill="#e9e8e3">4" six-color e-paper.</text>

    <!-- now playing hi-res card -->
    <g transform="translate(0,560)">
      <rect width="660" height="200" rx="18" fill="#1d1d21" stroke="#f4c400" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="40" cy="44" r="8" fill="#2fbf71"/>
      <text x="60" y="51" font-size="19" font-weight="bold" letter-spacing="3" fill="#9a9a95">NOW PLAYING</text>
      <text x="32" y="104" font-size="38" font-weight="bold" fill="#f6f5f1">Glass Harbor</text>
      <text x="32" y="140" font-size="24" fill="#b9b8b2">Northern Relay — Low Tide Signals</text>
      <text x="32" y="182" font-size="26" font-weight="bold" fill="#f4c400">TIDAL 384kHz/32bit · 24576 kbps</text>
    </g>

    <!-- features -->
    <g font-size="25" fill="#e9e8e3" transform="translate(0,820)">
      <rect x="0" y="-18" width="18" height="18" fill="#f4c400"/><text x="34" y="0">Album art, track info, and the format/bitrate line</text>
      <rect x="0" y="30" width="18" height="18" fill="#c0392b"/><text x="34" y="48">Redraws only when the track changes</text>
      <rect x="0" y="78" width="18" height="18" fill="#3b6fb6"/><text x="34" y="96">Next / previous on the hardware buttons</text>
      <rect x="0" y="126" width="18" height="18" fill="#2e8f50"/><text x="34" y="144">Setup portal at liner.local + OTA updates</text>
    </g>

    <text x="0" y="1060" font-size="17" letter-spacing="1.2" fill="#8a8a86">ESP32-S3 · SPECTRA 6 E-PAPER · PLATFORMIO · M5UNIFIED · VOLUMIO</text>
    <text x="0" y="1102" font-size="24" font-weight="bold" fill="#f6f5f1">github.com/m5stack-lab/Liner</text>
  </g>

  <!-- bottom spectra stripe -->
  <g transform="translate(0,1188)">
    <rect width="267" height="12" fill="#3a3a3e"/><rect x="267" width="267" height="12" fill="#f6f5f1"/>
    <rect x="534" width="267" height="12" fill="#f4c400"/><rect x="801" width="267" height="12" fill="#c0392b"/>
    <rect x="1068" width="266" height="12" fill="#1b3a6b"/><rect x="1334" width="266" height="12" fill="#2e6f40"/>
  </g>
</svg>
