<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Liner</title>
<desc id="d">Liner: now-playing liner notes for Volumio 4 on an M5Stack PaperColor's six-color e-paper. A small PaperColor cycles through album covers with e-paper refresh flashes.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22"/></pattern>
<radialGradient id="glowY" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f4c400" stop-opacity=".22"/><stop offset="1" stop-color="#f4c400" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c0392b" stop-opacity=".16"/><stop offset="1" stop-color="#c0392b" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="dev" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7f7f4"/><stop offset="1" stop-color="#e4e4df"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="1198" height="398" rx="18"/></clipPath>
<clipPath id="stripeclip"><rect x="420" y="186" width="348" height="6"/></clipPath>
<clipPath id="scr"><rect x="96" y="96" width="196" height="294"/></clipPath>
</defs>
<style>
.drift1{animation:d1 18s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(120px,40px)}}
.drift2{animation:d2 22s ease-in-out infinite alternate}@keyframes d2{to{transform:translate(-140px,-30px)}}
.drift3{animation:d3 26s ease-in-out infinite alternate}@keyframes d3{to{transform:translate(80px,-50px)}}
.shine{animation:sh 4.5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-140px)}60%,100%{transform:translateX(420px)}}
.step{animation:st 2.5s ease-in-out infinite;opacity:.3}@keyframes st{0%,100%{opacity:.3}20%{opacity:1}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.live{animation:lv 1.6s ease-in-out infinite}@keyframes lv{50%{opacity:.35}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="400" fill="#0d1117"/>
<rect width="1200" height="400" fill="url(#g)"/>
<ellipse class="drift1" cx="200" cy="120" rx="260" ry="200" fill="url(#glowY)"/>
<ellipse class="drift2" cx="1000" cy="320" rx="300" ry="220" fill="url(#glowB)"/>
<ellipse class="drift3" cx="640" cy="40" rx="260" ry="180" fill="url(#glowR)"/>
</g>
<rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="#30363d"/>

